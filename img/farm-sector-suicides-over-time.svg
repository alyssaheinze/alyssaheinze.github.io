<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">Maharashtra’s share of Indian farm-sector suicides, 2019–2024</title>
  <desc id="desc">Line chart showing that Maharashtra accounted for between 36.3 and 38.5 percent of all Indian farm-sector deaths by suicide from 2019 through 2024.</desc>
  <rect width="820" height="470" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="30" font-size="22" font-weight="700" fill="#171717">Maharashtra’s share of the all-India total</text>
    <g stroke="#dedbd5" stroke-width="1">
      <line x1="74" y1="370" x2="780" y2="370"/>
      <line x1="74" y1="273" x2="780" y2="273"/>
      <line x1="74" y1="177" x2="780" y2="177"/>
      <line x1="74" y1="80" x2="780" y2="80"/>
    </g>
    <g fill="#6d6a66" font-size="13" text-anchor="end">
      <text x="64" y="375">34%</text>
      <text x="64" y="278">36%</text>
      <text x="64" y="182">38%</text>
      <text x="64" y="85">40%</text>
    </g>
    <g fill="#6d6a66" font-size="13" text-anchor="middle">
      <text x="110" y="399">2019</text><text x="242" y="399">2020</text>
      <text x="374" y="399">2021</text><text x="506" y="399">2022</text>
      <text x="638" y="399">2023</text><text x="770" y="399">2024</text>
    </g>
    <polyline fill="none" stroke="#a61f2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="110,167 242,201 374,211 506,196 638,153 770,259"/>
    <g fill="#a61f2b">
      <circle cx="110" cy="167" r="7"/><circle cx="242" cy="201" r="7"/><circle cx="374" cy="211" r="7"/><circle cx="506" cy="196" r="7"/><circle cx="638" cy="153" r="7"/><circle cx="770" cy="259" r="7"/>
    </g>
    <g fill="#a61f2b" font-size="14" font-weight="700" text-anchor="middle">
      <text x="110" y="148">38.2%</text><text x="242" y="182">37.5%</text>
      <text x="374" y="238">37.3%</text><text x="506" y="177">37.6%</text>
      <text x="638" y="134">38.5%</text><text x="770" y="286">36.3%</text>
    </g>
  </g>
</svg>
