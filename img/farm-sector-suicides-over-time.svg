<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">Farm-sector suicides in Maharashtra and the average Indian state, 2023–2024</title>
  <desc id="desc">Line chart comparing farm-sector deaths by suicide in Maharashtra with the average across Indian states in 2023 and 2024. Maharashtra recorded 4,151 deaths in 2023 and 3,824 in 2024, compared with state averages of 383 and 375.</desc>
  <rect width="820" height="470" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="30" font-size="22" font-weight="700" fill="#171717">Maharashtra and the state average</text>
    <g stroke="#dedbd5" stroke-width="1">
      <line x1="74" y1="370" x2="780" y2="370"/>
      <line x1="74" y1="301" x2="780" y2="301"/>
      <line x1="74" y1="232" x2="780" y2="232"/>
      <line x1="74" y1="163" x2="780" y2="163"/>
      <line x1="74" y1="94" x2="780" y2="94"/>
    </g>
    <g fill="#6d6a66" font-size="13" text-anchor="end">
      <text x="64" y="375">0</text>
      <text x="64" y="306">1,000</text>
      <text x="64" y="237">2,000</text>
      <text x="64" y="168">3,000</text>
      <text x="64" y="99">4,000</text>
    </g>
    <g fill="#6d6a66" font-size="14" text-anchor="middle">
      <text x="250" y="404">2023</text>
      <text x="610" y="404">2024</text>
    </g>
    <polyline fill="none" stroke="#a61f2b" stroke-width="6" stroke-linecap="round" points="250,84 610,107"/>
    <polyline fill="none" stroke="#8c918d" stroke-width="5" stroke-linecap="round" points="250,343 610,344"/>
    <g fill="#a61f2b">
      <circle cx="250" cy="84" r="7"/><circle cx="610" cy="107" r="7"/>
    </g>
    <g fill="#8c918d">
      <circle cx="250" cy="343" r="7"/><circle cx="610" cy="344" r="7"/>
    </g>
    <g font-size="15" font-weight="700" text-anchor="middle">
      <text x="250" y="68" fill="#a61f2b">4,151</text>
      <text x="610" y="91" fill="#a61f2b">3,824</text>
      <text x="250" y="329" fill="#6f7571">383</text>
      <text x="610" y="330" fill="#6f7571">375</text>
    </g>
    <g font-size="14">
      <line x1="155" y1="438" x2="185" y2="438" stroke="#a61f2b" stroke-width="6"/>
      <text x="195" y="443" fill="#242424">Maharashtra</text>
      <line x1="376" y1="438" x2="406" y2="438" stroke="#8c918d" stroke-width="5"/>
      <text x="416" y="443" fill="#242424">Average Indian state</text>
    </g>
  </g>
</svg>
